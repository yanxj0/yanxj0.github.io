<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WASM Parser</title>
  </head>
  <body>
    <input type="file" id="fileInput" />
    <div id="progress"></div>
    <script src="parser.js"></script>
    <script>
      // WASM 模块
      let wasmModule = Module;
      // Web Worker
      const worker = new Worker("worker.js");
      // 全局状态
      let groups = []; // 存储解析的组数据
      let totalGroups = 0; // 总组数
      let fileName = ""; // 输入文件名
      let chunkCount = 0; // 已处理块数

      // 处理 Worker 消息
      worker.onmessage = (e) => {
        if (e.data.type === "group") {
          // 存储组数据
          groups.push(e.data.data);
          totalGroups = e.data.total_groups;
        } else if (e.data.type === "progress") {
          // 更新进度显示
          document.getElementById(
            "progress"
          ).textContent = `Progress: ${e.data.progress.toFixed(2)}%`;
        } else if (e.data.type === "complete") {
          try {
            if (groups.length === 0) throw new Error("No groups processed");
            // 拼接 JSON
            const jsonContent = "[" + groups.join(",") + "]";
            const parsedGroups = JSON.parse(jsonContent);
            const totalDataPoints =
              parsedGroups.length * parsedGroups[0].length;
            // 打印统计信息
            console.log("Parsed groups:", parsedGroups.length, "rows");
            console.log("Total data points:", totalDataPoints);
            console.log("Min value:", e.data.min_value);
            console.log("Max value:", e.data.max_value);

            // 输出 JSON 文件
            const jsonBlob = new Blob([jsonContent], {
              type: "application/json",
            });
            const jsonUrl = URL.createObjectURL(jsonBlob);
            const jsonA = document.createElement("a");
            jsonA.href = jsonUrl;
            jsonA.download = `${fileName}_parsed.json`;
            document.body.appendChild(jsonA);
            jsonA.click();
            document.body.removeChild(jsonA);
            URL.revokeObjectURL(jsonUrl);

            // 生成 Base-58 压缩 .bin
            const binOutput = [];
            for (let i = 0; i < parsedGroups.length; i++) {
              const values = new Int16Array(parsedGroups[i]);
              // 分配 WASM 内存
              const valuesPtr = wasmModule._malloc(values.length * 2);
              wasmModule.HEAP16.set(values, valuesPtr / 2);
              const outputSizePtr = wasmModule._malloc(4);
              // 调用 Base-58 压缩
              const binDataPtr = wasmModule._generate_base58_bin(
                valuesPtr,
                values.length,
                outputSizePtr
              );
              const outputSize = wasmModule.HEAP32[outputSizePtr / 4];

              if (binDataPtr === 0 || outputSize === 0) {
                wasmModule._free(valuesPtr);
                wasmModule._free(outputSizePtr);
                throw new Error(`Base-58 generation failed for group ${i}`);
              }

              // 创建头部
              const header = new ArrayBuffer(52);
              const headerView = new DataView(header);
              headerView.setInt32(48, outputSize, true);
              const compressedData = new Uint8Array(
                wasmModule.HEAPU8.subarray(binDataPtr, binDataPtr + outputSize)
              );
              binOutput.push(new Uint8Array(header));
              binOutput.push(compressedData);

              // 释放 WASM 内存
              wasmModule._free_base58_bin(binDataPtr);
              wasmModule._free(valuesPtr);
              wasmModule._free(outputSizePtr);
            }
            // 拼接输出
            const totalLength = binOutput.reduce(
              (sum, arr) => sum + arr.length,
              0
            );
            const binData = new Uint8Array(totalLength);
            let offset = 0;
            for (const arr of binOutput) {
              binData.set(arr, offset);
              offset += arr.length;
            }
            // 输出 .bin 文件
            const binBlob = new Blob([binData], {
              type: "application/octet-stream",
            });
            const binUrl = URL.createObjectURL(binBlob);
            const binA = document.createElement("a");
            binA.href = binUrl;
            binA.download = `${fileName}_base58_compressed.bin`;
            document.body.appendChild(binA);
            binA.click();
            document.body.removeChild(binA);
            URL.revokeObjectURL(binUrl);

            // 生成 TIFF 文件
            const width = parsedGroups[0].length;
            const height = parsedGroups.length;
            console.log("TIFF dimensions:", width, "x", height);
            // 验证组长度一致性
            for (let i = 0; i < parsedGroups.length; i++) {
              if (parsedGroups[i].length !== width) {
                throw new Error(`Inconsistent group length at index ${i}`);
              }
            }
            // 创建像素数组
            const pixels = new Uint16Array(width * height);
            for (let i = 0; i < parsedGroups.length; i++) {
              for (let j = 0; j < parsedGroups[i].length; j++) {
                const value = parsedGroups[i][j];
                pixels[i * width + j] = isNaN(value) ? 0 : value + 590;
              }
            }
            // 分配 WASM 内存
            const pixelsPtr = wasmModule._malloc(pixels.length * 2);
            wasmModule.HEAPU16.set(pixels, pixelsPtr / 2);
            const outputSizePtr = wasmModule._malloc(4);
            // 生成 TIFF
            const tiffDataPtr = wasmModule._generate_tiff(
              pixelsPtr,
              width,
              height,
              outputSizePtr
            );
            const outputSize = wasmModule.HEAP32[outputSizePtr / 4];
            if (tiffDataPtr === 0 || outputSize === 0) {
              wasmModule._free(pixelsPtr);
              wasmModule._free(outputSizePtr);
              throw new Error("TIFF generation failed");
            }
            const tiffData = new Uint8Array(
              wasmModule.HEAPU8.subarray(tiffDataPtr, tiffDataPtr + outputSize)
            );
            console.log("TIFF buffer size:", tiffData.length);
            // 输出 TIFF 文件
            const tiffBlob = new Blob([tiffData], { type: "image/tiff" });
            const tiffUrl = URL.createObjectURL(tiffBlob);
            const tiffA = document.createElement("a");
            tiffA.href = tiffUrl;
            tiffA.download = `${fileName}_parsed.tiff`;
            document.body.appendChild(tiffA);
            tiffA.click();
            document.body.removeChild(tiffA);
            URL.revokeObjectURL(tiffUrl);
            // 释放 WASM 内存
            wasmModule._free_tiff(tiffDataPtr);
            wasmModule._free(pixelsPtr);
            wasmModule._free(outputSizePtr);
          } catch (error) {
            console.error("Error during output generation:", error.message);
            alert("输出失败: " + error.message);
          }
          // 重置状态
          groups = [];
          totalGroups = 0;
          chunkCount = 0;
        } else if (e.data.type === "error") {
          console.error("Worker error:", e.data.error);
          alert("解析失败: " + e.data.error);
        }
      };

      // 处理文件输入
      document
        .getElementById("fileInput")
        .addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (file) {
            fileName = file.name;
            const chunkSize = 5 * 1024 * 1024; // 5MB 块
            let offset = 0,
              carryOver = new Uint8Array(0);
            const readNextChunk = () => {
              if (offset >= file.size && carryOver.length === 0) {
                worker.postMessage({ type: "finish", fileName: file.name });
                return;
              }
              const end = Math.min(offset + chunkSize, file.size);
              const slice = file.slice(offset, end);
              const reader = new FileReader();
              reader.onload = (e) => {
                let buffer = new Uint8Array(e.target.result);
                let combined = new Uint8Array(carryOver.length + buffer.length);
                combined.set(carryOver, 0);
                combined.set(buffer, carryOver.length);
                let localOffset = 0;
                // 分割完整组
                while (localOffset + 52 <= combined.length) {
                  const dataCount = new DataView(
                    combined.buffer,
                    localOffset + 48,
                    4
                  ).getInt32(0, true);
                  const totalSize = 52 + dataCount * 2;
                  if (localOffset + totalSize > combined.length) break;
                  localOffset += totalSize;
                }
                const processedLength = localOffset;
                if (processedLength > 0) {
                  const processedBuffer = combined.slice(0, processedLength);
                  console.log(
                    `Chunk ${chunkCount} processed, size: ${processedBuffer.length} bytes`
                  );
                  worker.postMessage(
                    {
                      type: "parse",
                      buffer: processedBuffer.buffer,
                      offset: offset - carryOver.length,
                      fileSize: file.size,
                    },
                    [processedBuffer.buffer]
                  );
                  chunkCount++;
                }
                carryOver = combined.slice(processedLength);
                offset = end;
                readNextChunk();
              };
              reader.readAsArrayBuffer(slice);
            };
            readNextChunk();
          }
        });
    </script>
  </body>
</html>
