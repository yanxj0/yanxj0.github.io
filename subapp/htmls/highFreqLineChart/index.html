<!doctype html>
<html>
  <head>
    <title>ECharts with Wasm Multi-Line Enhanced</title>
    <!-- 引入 ECharts 库用于绘制图表 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <!-- 引入编译后的 Wasm 模块 -->
    <script src="spectrum.js"></script>
    <style>
      #chart {
        width: 1280px;
        height: 720px;
        border: 1px solid black;
      } /* 图表容器样式 */
      #tooltip {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 5px;
        border-radius: 3px;
        pointer-events: none;
        display: none;
      } /* 提示框样式 */
      #selectionBox {
        position: absolute;
        border: 2px dashed #000;
        background: rgba(0, 0, 255, 0.1);
        pointer-events: none;
        display: none;
      } /* 选择框样式 */
      #controls {
        margin: 10px;
      } /* 控制面板样式 */
    </style>
  </head>
  <body>
    <!-- 控制面板：线的显示控制、背景色、Y 轴范围 -->
    <div id="controls">
      <label><input type="checkbox" id="line0" checked /> Real-time (Red)</label>
      <label><input type="checkbox" id="line1" checked /> Max (Green)</label>
      <label><input type="checkbox" id="line2" checked /> Min (Blue)</label>
      <label><input type="checkbox" id="line3" checked /> Avg (Yellow)</label>
      <br />
      <label>Background Color: <input type="color" id="bgColor" value="#FFFFFF" /></label>
      <br />
      <label>Y Min: <input type="number" id="yMin" value="-1.5" step="0.1" /></label>
      <label>Y Max: <input type="number" id="yMax" value="1.5" step="0.1" /></label>
    </div>
    <div id="chart"></div>
    <div id="tooltip"></div>
    <div id="selectionBox"></div>
    <script>
      // 当 Wasm 模块加载完成时执行
      Module.onRuntimeInitialized = () => {
        // 初始化 ECharts 图表
        const chart = echarts.init(document.getElementById('chart'))
        const width = Module._getWidth() // 获取默认宽度
        const height = Module._getHeight() // 获取默认高度
        const inputSize = Module._getInputSize() // 获取默认输入数据长度
        const gridWidth = width - 80 // 图表网格宽度（留出边距）
        const gridHeight = height - 80 // 图表网格高度（留出边距）

        // 创建前景画布用于显示 Wasm 生成的图像
        const frontCanvas = document.createElement('canvas')
        frontCanvas.width = gridWidth
        frontCanvas.height = gridHeight
        const frontCtx = frontCanvas.getContext('2d')

        let yMin = -40 // 默认 Y 轴最小值
        let yMax = 100 // 默认 Y 轴最大值

        // 配置 ECharts 图表选项
        const option = {
          grid: { left: 60, right: 20, top: 20, bottom: 60 }, // 网格边距
          xAxis: {
            type: 'value',
            min: 0,
            max: inputSize - 1,
            axisLine: { lineStyle: { color: '#000' } },
            axisTick: { show: true },
            axisLabel: { show: true, interval: 'auto' }
          },
          yAxis: {
            type: 'value',
            min: yMin, // 初始 Y 轴最小值
            max: yMax, // 初始 Y 轴最大值
            axisLine: { lineStyle: { color: '#000' } },
            axisTick: { show: true },
            axisLabel: { show: true }
          },
          graphic: [
            {
              type: 'image',
              id: 'spectrumImage',
              left: 60,
              top: 20,
              style: {
                image: frontCanvas,
                width: gridWidth,
                height: gridHeight
              },
              z: -1 // 放在底层
            }
          ]
        }
        chart.setOption(option)

        // 创建 Worker 用于处理数据和绘制
        const worker = new Worker('worker.js')
        const selectionBox = document.getElementById('selectionBox')
        const tooltip = document.getElementById('tooltip')

        // 初始化线条颜色和状态
        const colors = [
          255,
          0,
          0, // 实时线：红色
          0,
          255,
          0, // 最大值：绿色
          0,
          0,
          255, // 最小值：蓝色
          255,
          255,
          0 // 平均值：黄色
        ]
        let visibility = [true, true, true, true] // 默认所有线可见
        let bgColor = [255, 255, 255, 255] // 默认背景色：白色

        // 处理 Worker 消息
        worker.onmessage = (e) => {
          const { type, data } = e.data
          if (type === 'ready') {
            // 初始化 Worker
            worker.postMessage({
              type: 'init',
              width: gridWidth,
              height: gridHeight,
              inputSize: inputSize,
              colors: colors,
              visibility: visibility,
              bgColor: bgColor,
              yMin: yMin,
              yMax: yMax
            })
            Module._setParameters(gridWidth, gridHeight, inputSize)
          } else if (type === 'image') {
            // 更新图像数据
            const pixelData = new Uint8ClampedArray(data.pixels)
            const imageData = new ImageData(pixelData, gridWidth, gridHeight)
            frontCtx.putImageData(imageData, 0, 0)
            chart.setOption(
              {
                xAxis: { min: data.startIdx, max: data.endIdx },
                graphic: [{ id: 'spectrumImage', style: { image: frontCanvas } }]
              },
              { silent: true }
            )
          } else if (type === 'tooltip') {
            // 显示提示框
            tooltip.style.left = `${data.x + 10}px`
            tooltip.style.top = `${data.y + 10}px`
            tooltip.style.display = 'block'
            tooltip.innerHTML = data.text
          } else if (type === 'tooltipHide') {
            // 隐藏提示框
            tooltip.style.display = 'none'
          }
        }

        // 更新线的显示状态
        const updateVisibility = () => {
          visibility = [
            document.getElementById('line0').checked,
            document.getElementById('line1').checked,
            document.getElementById('line2').checked,
            document.getElementById('line3').checked
          ]
          worker.postMessage({
            type: 'updateVisibility',
            visibility: visibility
          })
        }
        document.getElementById('line0').addEventListener('change', updateVisibility)
        document.getElementById('line1').addEventListener('change', updateVisibility)
        document.getElementById('line2').addEventListener('change', updateVisibility)
        document.getElementById('line3').addEventListener('change', updateVisibility)

        // 更新背景色
        const updateBackgroundColor = () => {
          const colorHex = document.getElementById('bgColor').value
          bgColor = [
            parseInt(colorHex.slice(1, 3), 16), // R
            parseInt(colorHex.slice(3, 5), 16), // G
            parseInt(colorHex.slice(5, 7), 16), // B
            255 // A
          ]
          worker.postMessage({
            type: 'updateBackgroundColor',
            bgColor: bgColor
          })
        }
        document.getElementById('bgColor').addEventListener('input', updateBackgroundColor)

        // 更新 Y 轴范围
        const updateYRange = () => {
          yMin = parseFloat(document.getElementById('yMin').value)
          yMax = parseFloat(document.getElementById('yMax').value)
          if (yMin >= yMax) {
            yMin = yMax - 0.1 // 确保最小值小于最大值
            document.getElementById('yMin').value = yMin
          }
          worker.postMessage({ type: 'updateYRange', yMin: yMin, yMax: yMax })
          chart.setOption({ yAxis: { min: yMin, max: yMax } }) // 更新 ECharts Y 轴
        }
        document.getElementById('yMin').addEventListener('input', updateYRange)
        document.getElementById('yMax').addEventListener('input', updateYRange)

        // 鼠标滚轮事件：缩放
        chart.getZr().on('mousewheel', (params) => {
          worker.postMessage({
            type: 'mousewheel',
            wheelDelta: params.wheelDelta
          })
        })

        // 鼠标按下事件：开始拖动或选择
        chart.getZr().on('mousedown', (params) => {
          worker.postMessage({
            type: 'mousedown',
            button: params.event.button,
            offsetX: params.offsetX,
            offsetY: params.offsetY
          })
          if (params.event.button === 0 || params.event.button === 2) {
            selectionBox.style.left = `${params.offsetX}px`
            selectionBox.style.top = `${params.offsetY}px`
            selectionBox.style.width = '0px'
            selectionBox.style.height = '0px'
            selectionBox.style.display = 'block'
          }
        })

        // 鼠标移动事件：拖动或更新提示框
        chart.getZr().on('mousemove', (params) => {
          if (
            !params ||
            typeof params.offsetX === 'undefined' ||
            typeof params.offsetY === 'undefined'
          ) {
            console.error('Invalid mousemove params:', params)
            return
          }
          const xRel = params.offsetX - 60
          const yRel = params.offsetY - 20
          worker.postMessage({
            type: 'mousemove',
            offsetX: params.offsetX,
            offsetY: params.offsetY,
            xRel: xRel,
            yRel: yRel,
            gridWidth: gridWidth,
            gridHeight: gridHeight
          })
          if (selectionBox.style.display === 'block') {
            const width = params.offsetX - parseInt(selectionBox.style.left)
            const height = params.offsetY - parseInt(selectionBox.style.top)
            selectionBox.style.width = `${Math.abs(width)}px`
            selectionBox.style.height = `${Math.abs(height)}px`
            selectionBox.style.left = `${Math.min(
              parseInt(selectionBox.style.left),
              params.offsetX
            )}px`
          }
        })

        // 鼠标松开事件：结束拖动或选择
        chart.getZr().on('mouseup', (params) => {
          worker.postMessage({
            type: 'mouseup',
            button: params.event.button,
            offsetX: params.offsetX
          })
          selectionBox.style.display = 'none'
        })

        // 鼠标移出事件：重置状态
        chart.getZr().on('mouseout', () => {
          worker.postMessage({ type: 'mouseout' })
          selectionBox.style.display = 'none'
        })
      }
    </script>
  </body>
</html>
